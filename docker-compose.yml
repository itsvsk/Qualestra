services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sentinelqa
      POSTGRES_PASSWORD: sentinelqa
      POSTGRES_DB: sentinelqa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelqa"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  atlas-api:
    build: .
    command: uvicorn atlas.api.main:app --host 0.0.0.0 --port 8080
    environment:
      ATLAS_TEST_MODE: "true"
      ATLAS_TEST_CONTROL_TOKEN: local-test-token
      ATLAS_FAULT_PROFILE: ${ATLAS_FAULT_PROFILE:-fixed}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  atlas-web:
    image: nginx:1.27-alpine
    volumes:
      - ./atlas/web:/usr/share/nginx/html:ro
      - ./atlas/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["5173:80"]
    depends_on:
      atlas-api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  qa-worker:
    build: .
    command: sh -c "alembic upgrade head && python -m apps.qa_worker.main"
    environment:
      ARTIFACT_ROOT: /artifacts
      SENTINEL_DELIVERY_DIR: /artifacts/deliveries
      SENTINEL_DELIVERY_CONFIG: ${SENTINEL_DELIVERY_CONFIG:-}
      DATABASE_URL: postgresql+asyncpg://sentinelqa:sentinelqa@postgres:5432/sentinelqa
      LLM_PROVIDER: mock
      CONTROL_API_URL: http://127.0.0.1:8000
      ATLAS_API_URL: http://atlas-api:8080
      ATLAS_WEB_URL: http://atlas-web
      ATLAS_TEST_CONTROL_TOKEN: local-test-token
      SENTINEL_WORKER_TOKEN: local-worker-token
      SENTINEL_WORKER_CONCURRENCY: "4"
      SENTINEL_BROWSER_MODE: playwright
      SENTINEL_EMBED_CONTROL_API: "true"
    ports: ["8000:8000"]
    volumes:
      - artifacts:/artifacts
      - ./config:/app/config:ro
    depends_on:
      atlas-api: {condition: service_healthy}
      atlas-web: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports: ["3000:80"]
    depends_on:
      qa-worker: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["reliability"]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./reliability/toxiproxy.json:/config/toxiproxy.json:ro
    expose: ["8474", "18080", "18081", "18082", "18083", "18084"]
    depends_on:
      atlas-api: {condition: service_healthy}

  k6:
    image: grafana/k6:0.55.2
    profiles: ["reliability"]
    command: ["run", "/scripts/k6-smoke.js"]
    environment:
      ATLAS_API_URL: http://toxiproxy:18080
    volumes:
      - ./reliability:/scripts:ro
    depends_on:
      - toxiproxy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose: ["4317", "4318", "13133"]

volumes:
  postgres-data:
  artifacts:

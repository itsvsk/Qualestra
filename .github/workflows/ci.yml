name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install uv==0.11.29
      - run: uv sync --locked --extra dev
      - run: uv run ruff format --check . && uv run ruff check .
      - run: uv run mypy sentinelqa apps atlas scripts
      - run: mkdir -p artifacts && uv run pytest --junitxml=artifacts/pytest.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qualestra-python-test-evidence
          path: artifacts/pytest.xml
          if-no-files-found: warn
          retention-days: 14
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sentinelqa/dashboard lint
      - run: pnpm --filter @sentinelqa/dashboard test
      - run: pnpm --filter @sentinelqa/dashboard build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: docker compose build
      - run: docker compose up --detach --wait
      - run: docker compose exec -T qa-worker python scripts/live_smoke.py --base-url http://127.0.0.1:8000 --expected passed
      - run: docker compose exec -T qa-worker alembic current --check-heads
      - run: docker compose cp qa-worker:/artifacts ./compose-artifacts
        if: always()
      - run: docker compose logs --no-color > compose.log
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qualestra-compose-evidence
          path: |
            compose.log
            compose-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - run: docker compose down
        if: always()
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install uv==0.11.29
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/release_check.py
      - run: uv build
      - run: python -m venv /tmp/qualestra-package
      - run: /tmp/qualestra-package/bin/pip install dist/*.whl
      - run: /tmp/qualestra-package/bin/qualestra --version
      - run: /tmp/qualestra-package/bin/qualestra init /tmp/qualestra-project
      - run: /tmp/qualestra-package/bin/qualestra doctor /tmp/qualestra-project
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python .github/scripts/scan_secrets.py
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
